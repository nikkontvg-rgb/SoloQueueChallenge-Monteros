<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reglas y Preguntas Frecuentes · SoloQ Challenge Monteros</title>
    <style>
        :root {
            --fondo: #e8e5df;
            --rojo-oscuro: #35151c;
            --bordo: #70152b;
            --rubí: #941b3a;
            --blanco: #fff;
            --gris: #666;
        }
        * { box-sizing: border-box; }
        html { background: var(--fondo); }
        body { margin:0; padding:30px; min-height:100vh; font-family: Arial, sans-serif; color:#292929; background:var(--fondo); }
        .contenedor { max-width:900px; margin:auto; }
        .cabecera { text-align:center; margin-bottom:25px; }
        h1 { margin:0 0 8px; color:var(--rojo-oscuro); font-size:42px; }
        .subtitulo { color:var(--gris); font-size:18px; }
        .bloque { background:rgba(255,255,255,.78); border:1px solid #d2d2d2; border-radius:12px; padding:24px; margin-bottom:18px; box-shadow:0 8px 25px rgba(0,0,0,.06); }
        h2 { margin:0 0 12px; color:var(--bordo); }
        p { line-height:1.55; }
        .pendiente { text-align:center; color:var(--gris); }
        .volver { display:inline-block; margin-top:10px; padding:11px 16px; border-radius:7px; background:var(--bordo); color:var(--blanco); text-decoration:none; font-weight:700; }
        @media(max-width:700px){ body{padding:18px;} h1{font-size:32px;} }
    

/* TEMA VISUAL · INDUSTRIAL / ESPORTS */
html, body { background:#080a0b !important; color:#d7d7d7 !important; }
body { position:relative; overflow-x:hidden; background:radial-gradient(circle at 50% 10%,rgba(112,21,43,.14),transparent 32%),linear-gradient(180deg,#0b0d0e,#111415 50%,#080a0b) !important; }
body::before { content:""; position:fixed; inset:-35%; pointer-events:none; z-index:0; background:radial-gradient(circle at 20% 25%,rgba(148,27,58,.15),transparent 17%),radial-gradient(circle at 80% 70%,rgba(148,27,58,.09),transparent 18%),repeating-radial-gradient(circle at 0 0,rgba(255,255,255,.045) 0 2px,transparent 2px 24px); background-size:auto,auto,48px 48px; opacity:.5; animation:reglasFondo 30s linear infinite; }
@keyframes reglasFondo { 0%,100%{transform:translate(-1%,-1%)} 50%{transform:translate(1%,1%)} }
.contenedor { position:relative; z-index:1; }
.cabecera, .bloque { position:relative; overflow:hidden; background:linear-gradient(145deg,rgba(29,32,33,.97),rgba(13,15,16,.98)) !important; border:1px solid rgba(126,130,130,.45) !important; border-radius:8px !important; box-shadow:0 18px 45px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.035) !important; }
.cabecera { padding:26px 20px; }
.cabecera::before, .bloque::before { content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(90deg,#941b3a 0 50px,transparent 50px) top left/50px 2px no-repeat,linear-gradient(90deg,#941b3a 0 50px,transparent 50px) bottom right/50px 2px no-repeat,linear-gradient(#941b3a 0 22px,transparent 22px) top left/2px 22px no-repeat,linear-gradient(#941b3a 0 22px,transparent 22px) bottom right/2px 22px no-repeat; opacity:.85; }
h1 { color:#e4e4e4 !important; }
.subtitulo, .pendiente { color:#999 !important; }
.bloque h2 { color:#d63b5c !important; }
p { color:#c8c8c8; }
.volver { background:#70152b !important; border:1px solid #941b3a; }

    
/* =========================================================
   FONDO INDUSTRIAL VISIBLE + MOVIMIENTO SUTIL
   ========================================================= */
html {
    background: #171a1b !important;
}

body {
    position: relative;
    overflow-x: hidden;
    background:
        radial-gradient(circle at 18% 18%, rgba(148,27,58,.16), transparent 27%),
        radial-gradient(circle at 82% 72%, rgba(148,27,58,.12), transparent 29%),
        linear-gradient(135deg, #242728 0%, #171a1b 42%, #202324 70%, #111415 100%) !important;
}

body::before {
    content: "";
    position: fixed;
    inset: -18%;
    width: 136%;
    height: 136%;
    z-index: 0;
    pointer-events: none;
    opacity: .78;
    background:
        radial-gradient(circle at 22% 28%, rgba(148,27,58,.22), transparent 14%),
        radial-gradient(circle at 76% 68%, rgba(148,27,58,.17), transparent 17%),
        repeating-linear-gradient(
            60deg,
            transparent 0 46px,
            rgba(255,255,255,.035) 47px 48px,
            transparent 49px 94px
        ),
        repeating-linear-gradient(
            -60deg,
            transparent 0 46px,
            rgba(255,255,255,.025) 47px 48px,
            transparent 49px 94px
        ),
        linear-gradient(
            125deg,
            transparent 0 43%,
            rgba(148,27,58,.11) 43.3%,
            transparent 43.8% 67%,
            rgba(148,27,58,.07) 67.3%,
            transparent 67.8% 100%
        );
    background-size: auto, auto, 188px 188px, 188px 188px, 900px 900px;
    animation: fondoIndustrialVisible 26s ease-in-out infinite;
    will-change: transform;
}

body::after {
    content: "";
    position: fixed;
    inset: -10%;
    z-index: 0;
    pointer-events: none;
    opacity: .52;
    background:
        linear-gradient(
            115deg,
            transparent 0 17%,
            rgba(148,27,58,.12) 17.2%,
            transparent 17.7% 100%
        ),
        linear-gradient(
            295deg,
            transparent 0 73%,
            rgba(180,180,180,.045) 73.2%,
            transparent 73.7% 100%
        );
    background-size: 820px 820px, 1050px 1050px;
    animation: lineasIndustrialesVisibles 34s ease-in-out infinite;
    will-change: transform;
}

@keyframes fondoIndustrialVisible {
    0%, 100% {
        transform: translate3d(-2%, -1.5%, 0) rotate(0deg);
    }
    50% {
        transform: translate3d(2%, 1.5%, 0) rotate(.45deg);
    }
}

@keyframes lineasIndustrialesVisibles {
    0%, 100% {
        transform: translate3d(0, 0, 0);
    }
    50% {
        transform: translate3d(-2%, 1.5%, 0);
    }
}

    </style>
</head>
<body>
<div class="contenedor">
    <div class="cabecera">
        <h1>📜 Reglas y Preguntas Frecuentes</h1>
        <div class="subtitulo">SoloQ Challenge Monteros</div>
    </div>

    <div class="bloque pendiente">
        <h2>Próximamente</h2>
        <p>Las reglas y preguntas frecuentes del torneo aparecerán acá.</p>
        <p>Esta sección quedará preparada para explicar de forma clara y concisa todo lo que un nuevo participante necesita saber.</p>
        <a class="volver" href="/">← Volver al inicio</a>
    </div>
</div>
</body>
</html>
