<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reglas y Preguntas Frecuentes · SoloQ Challenge Monteros</title>
    <style>
        :root {
            --fondo: #e8e5df;
            --rojo-oscuro: #35151c;
            --bordo: #70152b;
            --rubí: #941b3a;
            --blanco: #fff;
            --gris: #666;
        }
        * { box-sizing: border-box; }
        html { background: var(--fondo); }
        body { margin:0; padding:30px; min-height:100vh; font-family: Arial, sans-serif; color:#292929; background:var(--fondo); }
        .contenedor { max-width:900px; margin:auto; }
        .cabecera { text-align:center; margin-bottom:25px; }
        h1 { margin:0 0 8px; color:var(--rojo-oscuro); font-size:42px; }
        .subtitulo { color:var(--gris); font-size:18px; }
        .bloque { background:rgba(255,255,255,.78); border:1px solid #d2d2d2; border-radius:12px; padding:24px; margin-bottom:18px; box-shadow:0 8px 25px rgba(0,0,0,.06); }
        h2 { margin:0 0 12px; color:var(--bordo); }
        p { line-height:1.55; }
        .pendiente { text-align:center; color:var(--gris); }
        .volver { display:inline-block; margin-top:10px; padding:11px 16px; border-radius:7px; background:var(--bordo); color:var(--blanco); text-decoration:none; font-weight:700; }
        @media(max-width:700px){ body{padding:18px;} h1{font-size:32px;} }
    </style>
</head>
<body>
<div class="contenedor">
    <div class="cabecera">
        <h1>📜 Reglas y Preguntas Frecuentes</h1>
        <div class="subtitulo">SoloQ Challenge Monteros</div>
    </div>

    <div class="bloque pendiente">
        <h2>Próximamente</h2>
        <p>Las reglas y preguntas frecuentes del torneo aparecerán acá.</p>
        <p>Esta sección quedará preparada para explicar de forma clara y concisa todo lo que un nuevo participante necesita saber.</p>
        <a class="volver" href="/">← Volver al inicio</a>
    </div>
</div>
</body>
</html>
