<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración · SoloQ Challenge Monteros</title>
    <style>
        :root {
            --fondo: #e8e5df;
            --fondo-claro: #f4f1eb;
            --bordo: #70152b;
            --bordo-oscuro: #35151c;
            --rojo: #941b3a;
            --verde: #23633b;
            --rojo-error: #8d2020;
            --texto: #292929;
            --gris: #777;
            --blanco: #fff;
            --borde: #d1ccc4;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 30px;
            background: linear-gradient(135deg, var(--fondo), var(--fondo-claro));
            color: var(--texto);
            font-family: Arial, sans-serif;
        }

        .contenedor {
            width: min(1150px, 100%);
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        h1 {
            margin: 0;
            color: var(--bordo-oscuro);
            font-size: clamp(28px, 4vw, 46px);
            letter-spacing: 1px;
        }

        .subtitulo {
            margin: 7px 0 0;
            color: var(--gris);
        }

        button {
            border: 0;
            border-radius: 7px;
            padding: 11px 16px;
            cursor: pointer;
            font-weight: 700;
        }

        .actualizar {
            background: var(--bordo);
            color: var(--blanco);
        }

        .seccion {
            background: rgba(255,255,255,.72);
            border: 1px solid var(--borde);
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,.06);
        }

        .seccion h2 {
            margin: 0 0 18px;
            color: var(--bordo-oscuro);
        }

        .cantidad {
            display: inline-block;
            min-width: 28px;
            padding: 3px 8px;
            margin-left: 5px;
            border-radius: 20px;
            background: var(--bordo);
            color: white;
            text-align: center;
            font-size: 13px;
        }

        .lista {
            display: grid;
            gap: 12px;
        }

        .tarjeta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            padding: 16px;
            background: var(--fondo-claro);
            border: 1px solid var(--borde);
            border-radius: 9px;
        }

        .datos {
            min-width: 0;
        }

        .nombre {
            font-size: 19px;
            font-weight: 800;
            color: var(--bordo-oscuro);
        }

        .email {
            margin-top: 5px;
            color: #555;
        }

        .riot {
            margin-top: 5px;
            color: #555;
        }

        .fecha {
            margin-top: 5px;
            color: var(--gris);
            font-size: 13px;
        }

        .stream {
            margin-top: 8px;
        }

        .stream a, .comprobante a {
            color: var(--bordo);
            font-weight: 700;
            text-decoration: none;
        }

        .stream a:hover, .comprobante a:hover {
            text-decoration: underline;
        }

        .comprobante {
            margin-top: 8px;
        }

        .comprobante img {
            display: block;
            max-width: 180px;
            max-height: 130px;
            margin-top: 8px;
            border: 1px solid var(--borde);
            border-radius: 6px;
            cursor: pointer;
            object-fit: contain;
            background: white;
        }

        .acciones {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 8px;
        }

        .aprobar { background: var(--verde); color: white; }
        .rechazar, .borrar { background: var(--rojo-error); color: white; }

        .vacio {
            padding: 25px;
            text-align: center;
            color: var(--gris);
            border: 1px dashed var(--borde);
            border-radius: 8px;
        }

        #mensaje {
            position: fixed;
            right: 20px;
            bottom: 20px;
            max-width: min(420px, calc(100% - 40px));
            padding: 13px 17px;
            border-radius: 8px;
            color: white;
            background: var(--bordo);
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
            transition: .2s;
        }

        #mensaje.visible {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 700px) {
            body { padding: 16px; }
            header { align-items: flex-start; flex-direction: column; }
            .tarjeta { align-items: flex-start; flex-direction: column; }
            .acciones { justify-content: flex-start; width: 100%; }
        }
    

/* TEMA VISUAL · INDUSTRIAL / ESPORTS */
html, body { background:#080a0b !important; color:#d7d7d7 !important; }
body { position:relative; overflow-x:hidden; background:radial-gradient(circle at 50% 10%,rgba(112,21,43,.14),transparent 32%),linear-gradient(180deg,#0b0d0e,#111415 50%,#080a0b) !important; }
body::before { content:""; position:fixed; inset:-35%; pointer-events:none; z-index:0; background:radial-gradient(circle at 20% 25%,rgba(148,27,58,.15),transparent 17%),radial-gradient(circle at 80% 70%,rgba(148,27,58,.09),transparent 18%),repeating-radial-gradient(circle at 0 0,rgba(255,255,255,.045) 0 2px,transparent 2px 24px); background-size:auto,auto,48px 48px; opacity:.5; animation:adminFondo 30s linear infinite; }
@keyframes adminFondo { 0%,100%{transform:translate(-1%,-1%)} 50%{transform:translate(1%,1%)} }
.contenedor { position:relative; z-index:1; }
header, .seccion { background:linear-gradient(145deg,rgba(29,32,33,.97),rgba(13,15,16,.98)) !important; border:1px solid rgba(126,130,130,.45) !important; border-radius:8px !important; box-shadow:0 18px 45px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.035) !important; }
header { padding:22px 26px; position:relative; overflow:hidden; }
header::before, .seccion::before, .tarjeta::before { content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(90deg,#941b3a 0 45px,transparent 45px) top left/45px 2px no-repeat,linear-gradient(90deg,#941b3a 0 45px,transparent 45px) bottom right/45px 2px no-repeat,linear-gradient(#941b3a 0 20px,transparent 20px) top left/2px 20px no-repeat,linear-gradient(#941b3a 0 20px,transparent 20px) bottom right/2px 20px no-repeat; opacity:.85; }
.seccion { padding:22px; position:relative; overflow:hidden; }
h1, .seccion h2 { color:#e3e3e3 !important; }
.subtitulo, .fecha, .vacio { color:#8f8f8f !important; }
.tarjeta { position:relative; overflow:hidden; background:linear-gradient(145deg,#242728,#151718) !important; border:1px solid #484c4d !important; border-radius:7px !important; }
.nombre { color:#eee !important; }
.email, .riot { color:#bdbdbd !important; }
.stream a, .comprobante a { color:#d3ad78 !important; }
.comprobante img { border-color:#555 !important; background:#0d0f10 !important; }
.actualizar { background:#70152b !important; border:1px solid #941b3a !important; }
.cantidad { background:#70152b !important; }
.aprobar { background:#245a3a !important; }
.rechazar, .borrar { background:#761e2c !important; }
.vacio { border-color:#4a4d4e !important; }
#mensaje { background:#70152b !important; border:1px solid #941b3a; box-shadow:0 10px 25px rgba(0,0,0,.4); }

    
/* =========================================================
   FONDO INDUSTRIAL VISIBLE + MOVIMIENTO SUTIL
   ========================================================= */
html {
    background: #171a1b !important;
}

body {
    position: relative;
    overflow-x: hidden;
    background:
        radial-gradient(circle at 18% 18%, rgba(148,27,58,.16), transparent 27%),
        radial-gradient(circle at 82% 72%, rgba(148,27,58,.12), transparent 29%),
        linear-gradient(135deg, #242728 0%, #171a1b 42%, #202324 70%, #111415 100%) !important;
}

body::before {
    content: "";
    position: fixed;
    inset: -18%;
    width: 136%;
    height: 136%;
    z-index: 0;
    pointer-events: none;
    opacity: .78;
    background:
        radial-gradient(circle at 22% 28%, rgba(148,27,58,.22), transparent 14%),
        radial-gradient(circle at 76% 68%, rgba(148,27,58,.17), transparent 17%),
        repeating-linear-gradient(
            60deg,
            transparent 0 46px,
            rgba(255,255,255,.035) 47px 48px,
            transparent 49px 94px
        ),
        repeating-linear-gradient(
            -60deg,
            transparent 0 46px,
            rgba(255,255,255,.025) 47px 48px,
            transparent 49px 94px
        ),
        linear-gradient(
            125deg,
            transparent 0 43%,
            rgba(148,27,58,.11) 43.3%,
            transparent 43.8% 67%,
            rgba(148,27,58,.07) 67.3%,
            transparent 67.8% 100%
        );
    background-size: auto, auto, 188px 188px, 188px 188px, 900px 900px;
    animation: fondoIndustrialVisible 26s ease-in-out infinite;
    will-change: transform;
}

body::after {
    content: "";
    position: fixed;
    inset: -10%;
    z-index: 0;
    pointer-events: none;
    opacity: .52;
    background:
        linear-gradient(
            115deg,
            transparent 0 17%,
            rgba(148,27,58,.12) 17.2%,
            transparent 17.7% 100%
        ),
        linear-gradient(
            295deg,
            transparent 0 73%,
            rgba(180,180,180,.045) 73.2%,
            transparent 73.7% 100%
        );
    background-size: 820px 820px, 1050px 1050px;
    animation: lineasIndustrialesVisibles 34s ease-in-out infinite;
    will-change: transform;
}

@keyframes fondoIndustrialVisible {
    0%, 100% {
        transform: translate3d(-2%, -1.5%, 0) rotate(0deg);
    }
    50% {
        transform: translate3d(2%, 1.5%, 0) rotate(.45deg);
    }
}

@keyframes lineasIndustrialesVisibles {
    0%, 100% {
        transform: translate3d(0, 0, 0);
    }
    50% {
        transform: translate3d(-2%, 1.5%, 0);
    }
}

    </style>
</head>
<body>
<div class="contenedor">
    <header>
        <div>
            <h1>ADMINISTRACIÓN</h1>
            <p class="subtitulo">SoloQ Challenge Monteros · Gestión de registros</p>
        </div>
        <button class="actualizar" onclick="cargarTodo()">↻ ACTUALIZAR</button>
    </header>

    <section class="seccion">
        <h2>SOLICITUDES PENDIENTES <span class="cantidad" id="cantidadSolicitudes">0</span></h2>
        <div class="lista" id="listaSolicitudes"></div>
    </section>

    <section class="seccion">
        <h2>JUGADORES REGISTRADOS <span class="cantidad" id="cantidadJugadores">0</span></h2>
        <div class="lista" id="listaJugadores"></div>
    </section>

    <section class="seccion">
        <h2>CONSULTAS <span class="cantidad" id="cantidadConsultas">0</span></h2>
        <div class="lista" id="listaConsultas"></div>
    </section>
</div>

<div id="mensaje"></div>

<script>
    const mensaje = document.getElementById("mensaje");

    function mostrarMensaje(texto) {
        mensaje.textContent = texto;
        mensaje.classList.add("visible");
        setTimeout(() => mensaje.classList.remove("visible"), 2500);
    }

    async function cargarSolicitudes() {
        const respuesta = await fetch("/api/admin/solicitudes");
        const resultado = await respuesta.json();

        if (!respuesta.ok || !resultado.ok) {
            throw new Error(resultado.error || "No se pudieron cargar las solicitudes.");
        }

        const solicitudes = resultado.solicitudes || [];
        document.getElementById("cantidadSolicitudes").textContent = solicitudes.length;

        const contenedor = document.getElementById("listaSolicitudes");

        if (!solicitudes.length) {
            contenedor.innerHTML = '<div class="vacio">No hay solicitudes pendientes.</div>';
            return;
        }

        contenedor.innerHTML = solicitudes.map(solicitud => `
            <div class="tarjeta">
                <div class="datos">
                    <div class="nombre">${escapar(solicitud.nombre)}</div>
                    <div class="email">📧 ${escapar(solicitud.email || "Sin Gmail")}</div>
                    <div class="riot">${escapar(solicitud.riot_id)} #${escapar(solicitud.riot_tag)}</div>
                    <div class="fecha">Solicitud: ${escapar(solicitud.fecha_solicitud || "Sin fecha")}</div>
                    ${solicitud.stream_url ? `<div class="stream">📺 <a href="${escapar(solicitud.stream_url)}" target="_blank" rel="noopener noreferrer">Ver stream</a></div>` : `<div class="stream">📺 Sin link de stream</div>`}
                    ${solicitud.comprobante && solicitud.comprobante.tipo === "postgres" ? `<div class="comprobante">💳 <a href="/api/admin/comprobantes/${encodeURIComponent(solicitud.comprobante.id)}" target="_blank">Ver comprobante</a><a href="/api/admin/comprobantes/${encodeURIComponent(solicitud.comprobante.id)}" target="_blank"><img src="/api/admin/comprobantes/${encodeURIComponent(solicitud.comprobante.id)}" alt="Comprobante"></a></div>` : `<div class="comprobante">💳 Comprobante no disponible</div>`}
                </div>
                <div class="acciones">
                    <button class="aprobar" onclick="aprobar('${escaparJs(solicitud.nombre)}')">✓ APROBAR</button>
                    <button class="rechazar" onclick="rechazar('${escaparJs(solicitud.nombre)}')">✕ RECHAZAR</button>
                </div>
            </div>
        `).join("");
    }

    async function cargarJugadores() {
        const respuesta = await fetch("/api/admin/jugadores");
        const resultado = await respuesta.json();

        if (!respuesta.ok || !resultado.ok) {
            throw new Error(resultado.error || "No se pudieron cargar los jugadores.");
        }

        const jugadores = resultado.jugadores || [];
        document.getElementById("cantidadJugadores").textContent = jugadores.length;

        const contenedor = document.getElementById("listaJugadores");

        if (!jugadores.length) {
            contenedor.innerHTML = '<div class="vacio">No hay jugadores registrados.</div>';
            return;
        }

        contenedor.innerHTML = jugadores.map(jugador => `
            <div class="tarjeta">
                <div class="datos">
                    <div class="nombre">${escapar(jugador.nombre)}</div>
                    <div class="email">📧 ${escapar(jugador.email || "Sin Gmail")}</div>
                    <div class="riot">${escapar(jugador.riot_id || "")} #${escapar(jugador.riot_tag || "")}</div>
                    ${jugador.stream_url ? `<div class="stream">📺 <a href="${escapar(jugador.stream_url)}" target="_blank" rel="noopener noreferrer">${escapar(jugador.stream_url)}</a></div>` : `<div class="stream">📺 Sin link de stream</div>`}
                </div>
                <div class="acciones">
                    <button class="borrar" onclick="borrarJugador('${escaparJs(jugador.nombre)}')">🗑 BORRAR JUGADOR</button>
                </div>
            </div>
        `).join("");
    }

    async function aprobar(nombre) {
        if (!confirm(`¿Aprobar a ${nombre}?`)) return;

        const respuesta = await fetch("/api/admin/solicitudes/aprobar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nombre })
        });

        const resultado = await respuesta.json();

        if (!respuesta.ok || !resultado.ok) {
            mostrarMensaje("❌ " + (resultado.error || "No se pudo aprobar."));
            return;
        }

        mostrarMensaje("✅ " + resultado.mensaje);
        await cargarTodo();
    }

    async function rechazar(nombre) {
        if (!confirm(`¿Rechazar la solicitud de ${nombre}?`)) return;

        const respuesta = await fetch("/api/admin/solicitudes/rechazar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nombre })
        });

        const resultado = await respuesta.json();

        if (!respuesta.ok || !resultado.ok) {
            mostrarMensaje("❌ " + (resultado.error || "No se pudo rechazar."));
            return;
        }

        mostrarMensaje("✅ " + resultado.mensaje);
        await cargarSolicitudes();
    }

    async function borrarJugador(nombre) {
        if (!confirm(`¿ESTÁS SEGURO de borrar a ${nombre}?\n\nSe eliminará del ranking y de la lista de jugadores.`)) return;

        const respuesta = await fetch(`/api/admin/jugadores/${encodeURIComponent(nombre)}`, {
            method: "DELETE"
        });

        const resultado = await respuesta.json();

        if (!respuesta.ok || !resultado.ok) {
            mostrarMensaje("❌ " + (resultado.error || "No se pudo borrar el jugador."));
            return;
        }

        mostrarMensaje("✅ " + resultado.mensaje);
        await cargarJugadores();
    }

    async function cargarConsultas() {
        const respuesta = await fetch("/api/admin/consultas");
        const resultado = await respuesta.json();

        if (!respuesta.ok || !resultado.ok) {
            throw new Error(resultado.error || "No se pudieron cargar las consultas.");
        }

        const consultas = resultado.consultas || [];
        document.getElementById("cantidadConsultas").textContent = consultas.length;

        const contenedor = document.getElementById("listaConsultas");

        if (!consultas.length) {
            contenedor.innerHTML = '<div class="vacio">No hay consultas pendientes.</div>';
            return;
        }

        contenedor.innerHTML = consultas.map(consulta => `
            <div class="tarjeta">
                <div class="datos">
                    <div class="nombre">💬 ${escapar(consulta.nombre)}</div>
                    <div class="fecha">Fecha: ${escapar(consulta.creada_en || "Sin fecha")}</div>
                    <div class="stream" style="white-space:pre-wrap; margin-top:10px;">${escapar(consulta.consulta)}</div>
                </div>
                <div class="acciones">
                    <button class="borrar" onclick="borrarConsulta(${Number(consulta.id)})">🗑 ELIMINAR</button>
                </div>
            </div>
        `).join("");
    }

    async function borrarConsulta(id) {
        if (!confirm("¿Eliminar esta consulta?")) return;

        const respuesta = await fetch(`/api/admin/consultas/${encodeURIComponent(id)}`, {
            method: "DELETE"
        });

        const resultado = await respuesta.json();

        if (!respuesta.ok || !resultado.ok) {
            mostrarMensaje("❌ " + (resultado.error || "No se pudo eliminar la consulta."));
            return;
        }

        mostrarMensaje("✅ " + resultado.mensaje);
        await cargarConsultas();
    }

    async function cargarTodo() {
        try {
            await Promise.all([
                cargarSolicitudes(),
                cargarJugadores(),
                cargarConsultas()
            ]);
        } catch (error) {
            mostrarMensaje("❌ " + error.message);
        }
    }

    function escapar(valor) {
        return String(valor ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function escaparJs(valor) {
        return String(valor ?? "")
            .replaceAll("\\", "\\\\")
            .replaceAll("'", "\\'")
            .replaceAll("\n", "\\n")
            .replaceAll("\r", "\\r");
    }

    cargarTodo();
    setInterval(cargarTodo, 15000);
</script>
</body>
</html>
