<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solo Queue Challenge</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
        }

        .contenedor {
            max-width: 900px;
            margin: auto;
        }

        .jugador {
            background: #1f2937;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 12px;
        }

        .nombre {
            font-size: 22px;
            font-weight: bold;
        }

        .riot {
            color: #9ca3af;
            margin-top: 5px;
        }

        .estado {
            margin-top: 15px;
            font-weight: bold;
            font-size: 18px;
        }

        .online {
            color: #22c55e;
        }

        .partida {
            color: #f59e0b;
        }

        .offline {
            color: #9ca3af;
        }

        .actualizacion {
            text-align: center;
            color: #6b7280;
            margin-top: 30px;
        }
        .contador {
            margin-top: 8px;
            color: #fbbf24;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>🏆 Solo Queue Challenge</h1>

        <div id="jugadores">
            Cargando jugadores...
        </div>

        <div class="actualizacion">
            🔄 Actualizando automáticamente...
        </div>

    </div>


    <script>

        // Guardamos el momento en que detectamos que cada jugador entró en partida
        const tiemposPartida = {};

        function formatearTiempo(segundos) {

            const minutos = Math.floor(segundos / 60);
            const segundosRestantes = segundos % 60;

            return `${minutos}:${segundosRestantes.toString().padStart(2, "0")}`;
        }


        function cargarJugadores() {

            fetch("/api/jugadores")
                .then(respuesta => respuesta.json())
                .then(jugadores => {

                    const contenedor = document.getElementById("jugadores");

                    contenedor.innerHTML = "";

                    const ahora = Date.now();

                    for (const nombre in jugadores) {

                        const jugador = jugadores[nombre];

                        let estadoTexto = "⚪ OFFLINE";
                        let claseEstado = "offline";
                        let contador = "";


                        if (jugador.estado === "online") {

                            estadoTexto = "🟢 ONLINE";
                            claseEstado = "online";

                        }


                        if (jugador.estado === "in_game") {

                            estadoTexto = "🎮 EN PARTIDA";
                            claseEstado = "partida";


                            // Si recién detectamos la partida,
                            // comenzamos el contador en 5 segundos
                            if (!tiemposPartida[nombre]) {
                                tiemposPartida[nombre] = ahora - 5000;
                            }


                            const segundos = Math.floor(
                                (ahora - tiemposPartida[nombre]) / 1000
                            );


                            contador = `
                                <div class="contador">
                                    ⏱️ ${formatearTiempo(segundos)}
                                </div>
                            `;

                        } else {

                            // Si salió de partida, eliminamos su contador
                            delete tiemposPartida[nombre];

                        }


                        contenedor.innerHTML += `
                            <div class="jugador">

                                <div class="nombre">
                                    ${nombre}
                                </div>

                                <div class="riot">
                                    Riot ID:
                                    ${jugador.riot_id}#${jugador.riot_tag}
                                </div>

                                <div class="estado ${claseEstado}">
                                    ${estadoTexto}
                                </div>

                                ${contador}

                            </div>
                        `;
                    }

                })
                .catch(error => {

                    console.error("Error:", error);

                });
        }


        // Actualizar inmediatamente
        cargarJugadores();


        // Consultar Riot cada 15 segundos
        setInterval(cargarJugadores, 15000);


        // Actualizar los contadores visualmente cada segundo
        setInterval(() => {

            for (const nombre in tiemposPartida) {

                const contador = document.querySelector(
                    `.jugador:has(.nombre)`
                );

            }

            // Volvemos a cargar la información visual
            // sin consultar Riot
            const elementos = document.querySelectorAll(".contador");

            for (const elemento of elementos) {

                const jugadorElemento = elemento.closest(".jugador");

                if (!jugadorElemento) {
                    continue;
                }

                const nombreElemento =
                    jugadorElemento.querySelector(".nombre");

                if (!nombreElemento) {
                    continue;
                }

                const nombre = nombreElemento.textContent.trim();

                if (tiemposPartida[nombre]) {

                    const segundos = Math.floor(
                        (Date.now() - tiemposPartida[nombre]) / 1000
                    );

                    elemento.textContent =
                        `⏱️ ${formatearTiempo(segundos)}`;
                }
            }

        }, 1000);

    </script>


        // Cargar inmediatamente
        cargarJugadores();


        // Actualizar cada 15 segundos
        setInterval(cargarJugadores, 15000);

    </script>

</body>

</html>
