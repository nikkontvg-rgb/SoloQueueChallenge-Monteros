<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solo Queue Challenge</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
        }

        .contenedor {
            max-width: 900px;
            margin: auto;
        }

        .jugador {
            background: #1f2937;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 12px;
        }

        .nombre {
            font-size: 22px;
            font-weight: bold;
        }

        .riot {
            color: #9ca3af;
            margin-top: 5px;
        }

        .estado {
            margin-top: 15px;
            font-weight: bold;
            font-size: 18px;
        }

        .online {
            color: #22c55e;
        }

        .partida {
            color: #f59e0b;
        }

        .offline {
            color: #9ca3af;
        }

        .actualizacion {
            text-align: center;
            color: #6b7280;
            margin-top: 30px;
        }

        .contador {
            margin-top: 8px;
            color: #fbbf24;
            font-size: 16px;
            font-weight: bold;
        }
        .ranking {
            margin-top: 30px;
            padding: 20px;
            background: #111827;
            border-radius: 12px;
        }

        .ranking h2 {
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
        }

        .ranking-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            margin-bottom: 8px;
            background: #1f2937;
            border-radius: 8px;
        }

        .ranking-posicion {
            width: 35px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }

        .ranking-nombre {
            flex: 1;
            font-weight: bold;
        }

        .ranking-rango {
            font-weight: bold;
        }

        .ranking-lp {
            min-width: 70px;
            text-align: right;
            color: #fbbf24;
        }
        
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>🏆 Solo Queue Challenge</h1>

        <div id="jugadores">
            Cargando jugadores...
        </div>

        <div class="actualizacion">
            🔄 Actualizando automáticamente...
        </div>

        <div class="ranking">
            <h2>🏆 RANKING</h2>
            <div id="ranking"></div>
        </div>

    </div>


    <script>
    let tiemposPartida = {};

    function formatearTiempo(segundos) {
        const minutos = Math.floor(segundos / 60);
        const segundosRestantes = segundos % 60;

        return `${minutos}:${segundosRestantes
            .toString()
            .padStart(2, "0")}`;
    }

    function cargarJugadores() {

        fetch("/api/jugadores")
            .then(respuesta => respuesta.json())
            .then(jugadores => {

                const contenedor =
                    document.getElementById("jugadores");

                contenedor.innerHTML = "";

                for (const nombre in jugadores) {

                    const jugador = jugadores[nombre];

                    let estadoTexto = "⚪ OFFLINE";
                    let claseEstado = "offline";
                    let contador = "";

                    if (jugador.estado === "online") {
                        estadoTexto = "🟢 ONLINE";
                        claseEstado = "online";
                    }

                    if (jugador.estado === "in_game") {

                        estadoTexto = "🎮 EN PARTIDA";
                        claseEstado = "partida";

                        if (jugador.game_start_time) {

                            tiemposPartida[nombre] =
                                jugador.game_start_time;

                            const segundos = Math.max(
                                0,
                                Math.floor(
                                    (Date.now() -
                                        jugador.game_start_time) / 1000
                                )
                            );

                            contador = `
                                <div class="contador">
                                    ⏱️ ${formatearTiempo(segundos)}
                                </div>
                            `;
                        }
                    } else {

                        delete tiemposPartida[nombre];

                    }

                    contenedor.innerHTML += `
                        <div class="jugador">

                            <div class="nombre">
                                ${nombre}
                            </div>

                            <div class="riot">
                                Riot ID:
                                ${jugador.riot_id}#${jugador.riot_tag}
                            </div>

                            <div class="estado ${claseEstado}">
                                ${estadoTexto}
                            </div>

                            ${contador}

                        </div>
                    `;
                }
                // =========================
                // RANKING
                // =========================

                const ranking = document.getElementById("ranking");

                const ordenTier = {
                    "IRON": 1,
                    "BRONZE": 2,
                    "SILVER": 3,
                    "GOLD": 4,
                    "PLATINUM": 5,
                    "EMERALD": 6,
                    "DIAMOND": 7,
                    "MASTER": 8,
                    "GRANDMASTER": 9,
                    "CHALLENGER": 10,
                    "UNRANKED": 0
                };

                const ordenDivision = {
                    "IV": 1,
                    "III": 2,
                    "II": 3,
                    "I": 4
                };

                const jugadoresRanking = Object.entries(jugadores);

                jugadoresRanking.sort((a, b) => {
                    const rangoA = a[1].rango;
                    const rangoB = b[1].rango;

                    const tierA = rangoA?.tier || "UNRANKED";
                    const tierB = rangoB?.tier || "UNRANKED";

                    if (ordenTier[tierA] !== ordenTier[tierB]) {
                        return ordenTier[tierB] - ordenTier[tierA];
                    }

                    const divisionA = ordenDivision[rangoA?.rank] || 0;
                    const divisionB = ordenDivision[rangoB?.rank] || 0;

                    if (divisionA !== divisionB) {
                        return divisionB - divisionA;
                    }

                    const lpA = rangoA?.lp || 0;
                    const lpB = rangoB?.lp || 0;

                    return lpB - lpA;
                });

                ranking.innerHTML = "";

                jugadoresRanking.forEach(([nombre, jugador], index) => {
                    const rango = jugador.rango;

                    let textoRango = "UNRANKED";
                    let lp = "";

                    if (rango && rango.tier && rango.tier !== "UNRANKED") {
                        textoRango =
                            `${rango.tier} ${rango.rank}`;

                        lp =
                            `${rango.lp} LP`;
                    }

                    let posicion = `${index + 1}°`;

                    if (index === 0) {
                        posicion = "🥇";
                    } else if (index === 1) {
                        posicion = "🥈";
                    } else if (index === 2) {
                        posicion = "🥉";
                    }

                    ranking.innerHTML += `
                        <div class="ranking-item">
                            <div class="ranking-posicion">
                                ${posicion}
                            </div>

                            <div class="ranking-nombre">
                                ${nombre}
                            </div>

                            <div class="ranking-rango">
                                ${textoRango}
                            </div>

                            <div class="ranking-lp">
                                ${lp}
                            </div>
                        </div>
                    `;
                });
            })
            .catch(error => {
                console.error("Error:", error);
            });
    }


    // Cargar inmediatamente
    cargarJugadores();


    // Comprobar estado de Riot cada 15 segundos
    setInterval(cargarJugadores, 15000);


    // Actualizar los contadores cada segundo
    setInterval(() => {

        const elementos =
            document.querySelectorAll(".contador");

        elementos.forEach(elemento => {

            const jugadorElemento =
                elemento.closest(".jugador");

            if (!jugadorElemento) {
                return;
            }

            const nombreElemento =
                jugadorElemento.querySelector(".nombre");

            if (!nombreElemento) {
                return;
            }

            const nombre =
                nombreElemento.textContent.trim();

            if (tiemposPartida[nombre]) {

                const segundos = Math.max(
                    0,
                    Math.floor(
                        (Date.now() -
                            tiemposPartida[nombre]) / 1000
                    )
                );

                elemento.textContent =
                    `⏱️ ${formatearTiempo(segundos)}`;
            }

        });

    }, 1000);

</script>

</body>

</html>
