<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solo Queue Challenge</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
        }

        .contenedor {
            max-width: 900px;
            margin: auto;
        }

        .jugador {
            background: #1f2937;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 12px;
        }

        .nombre {
            font-size: 22px;
            font-weight: bold;
        }

        .riot {
            color: #9ca3af;
            margin-top: 5px;
        }

        .estado {
            margin-top: 15px;
            font-weight: bold;
            font-size: 18px;
        }

        .online {
            color: #22c55e;
        }

        .partida {
            color: #f59e0b;
        }

        .offline {
            color: #9ca3af;
        }

        .actualizacion {
            text-align: center;
            color: #6b7280;
            margin-top: 30px;
        }

        .contador {
            margin-top: 8px;
            color: #fbbf24;
            font-size: 16px;
            font-weight: bold;
        }
        
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>🏆 Solo Queue Challenge</h1>

        <div id="jugadores">
            Cargando jugadores...
        </div>

        <div class="actualizacion">
            🔄 Actualizando automáticamente...
        </div>

    </div>


    <script>

    let partidas = {};


    function formatearTiempo(segundos) {

        const minutos = Math.floor(segundos / 60);
        const segundosRestantes = segundos % 60;

        return `${minutos}:${segundosRestantes.toString().padStart(2, "0")}`;
    }


    function cargarJugadores() {

        fetch("/api/jugadores")
            .then(respuesta => respuesta.json())
            .then(jugadores => {

                const contenedor = document.getElementById("jugadores");

                contenedor.innerHTML = "";

                const ahora = Date.now();


                for (const nombre in jugadores) {

                    const jugador = jugadores[nombre];

                    let estadoTexto = "⚪ OFFLINE";
                    let claseEstado = "offline";
                    let contador = "";


                    if (jugador.estado === "online") {

                        estadoTexto = "🟢 ONLINE";
                        claseEstado = "online";

                    }


                    if (jugador.estado === "in_game") {

                        estadoTexto = "🎮 EN PARTIDA";
                        claseEstado = "partida";


                        // Si es una partida nueva
                        if (!partidas[nombre]) {

                            partidas[nombre] = {
                                inicio: ahora - 5000
                            };

                        }


                        const segundos = Math.floor(
                            (ahora - partidas[nombre].inicio) / 1000
                        );


                        contador = `
                            <div class="contador">
                                ⏱️ ${formatearTiempo(segundos)}
                            </div>
                        `;

                    } else {

                        // Si salió de partida
                        delete partidas[nombre];

                    }


                    contenedor.innerHTML += `
                        <div class="jugador">

                            <div class="nombre">
                                ${nombre}
                            </div>

                            <div class="riot">
                                Riot ID:
                                ${jugador.riot_id}#${jugador.riot_tag}
                            </div>

                            <div class="estado ${claseEstado}">
                                ${estadoTexto}
                            </div>

                            ${contador}

                        </div>
                    `;
                }

            })
            .catch(error => {

                console.error("Error:", error);

            });
    }


    // Primera carga
    cargarJugadores();


    // Comprobar estado de Riot cada 15 segundos
    setInterval(cargarJugadores, 15000);


    // Actualizar el contador cada segundo
    setInterval(() => {

        const elementos = document.querySelectorAll(".contador");

        elementos.forEach(elemento => {

            const jugadorElemento = elemento.closest(".jugador");

            if (!jugadorElemento) {
                return;
            }

            const nombreElemento =
                jugadorElemento.querySelector(".nombre");

            if (!nombreElemento) {
                return;
            }

            const nombre = nombreElemento.textContent.trim();

            if (partidas[nombre]) {

                const segundos = Math.floor(
                    (Date.now() - partidas[nombre].inicio) / 1000
                );

                elemento.textContent =
                    `⏱️ ${formatearTiempo(segundos)}`;
            }

        });

    }, 1000);

</script>

</body>

</html>
