name: Construir instalador Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "agente_windows.py"
      - "requirements-agente.txt"
      - "build_windows.bat"
      - "installer/**"
      - ".github/workflows/build-installer.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias y construir EXE
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-agente.txt
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name SoloQChallengeAgente agente_windows.py
      - name: Instalar Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Construir instalador
        shell: cmd
        run: |
          mkdir dist-installer
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" installer\SoloQChallenge.iss
      - name: Publicar instalador descargable
        uses: actions/upload-artifact@v4
        with:
          name: Instalador-SoloQChallenge-Monteros
          path: dist-installer/Instalador_SoloQChallenge_Monteros.exe
          if-no-files-found: error
